<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isochrone Films | Film & Television Production Company, Los Angeles</title>
    <meta name="description" content="Isochrone Films is a Los Angeles-based film and television production company, home of the short film The End Is At Hand.">
    <link rel="canonical" href="https://isochronefilms.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Isochrone Films">
    <meta property="og:title" content="Isochrone Films | Film & Television Production Company">
    <meta property="og:description" content="Los Angeles-based film and television production company, home of the short film The End Is At Hand.">
    <meta property="og:url" content="https://isochronefilms.com/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Isochrone Films | Film & Television Production Company">
    <meta name="twitter:description" content="Los Angeles-based film and television production company, home of the short film The End Is At Hand.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Raleway:wght@200&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Isochrone Films",
        "url": "https://isochronefilms.com/",
        "logo": "https://isochronefilms.com/favicon.svg",
        "email": "hello@isochronefilms.com",
        "sameAs": []
    }
    </script>
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .wordmark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 90vw;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            z-index: 1;
        }

        .wordmark.ready {
            opacity: 1;
        }

        .title-row {
            display: flex;
            align-items: baseline;
        }

        .letter {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 9vw, 9.5rem);
            color: #fff;
            display: inline-block;
            line-height: 0.95;
        }

        .films-row .letter {
            font-size: clamp(1rem, 2.6vw, 2.8rem);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.8;
            z-index: 1;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }



        .top-nav {
            position: fixed;
            top: 1.4rem;
            right: 1.8rem;
            display: flex;
            gap: 2rem;
            z-index: 2;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.4vw, 1.05rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .top-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            footer {
                font-size: 0.42rem;
                letter-spacing: 0.08em;
                padding: 0.8rem 1rem;
                gap: 0.3rem;
            }

            .top-nav {
                top: 1rem;
                right: 1rem;
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/about">About</a>
        <a href="/slate">Slate</a>
        <a href="/contact">Contact</a>
    </nav>

    <h1 class="wordmark" id="wordmark">
        <span class="sr-only">Isochrone Films</span>
        <div class="title-row" id="isochrone" aria-hidden="true">
            <span class="letter">I</span>
            <span class="letter">S</span>
            <span class="letter">O</span>
            <span class="letter">C</span>
            <span class="letter">H</span>
            <span class="letter">R</span>
            <span class="letter">O</span>
            <span class="letter">N</span>
            <span class="letter">E</span>
        </div>
        <div class="title-row films-row" id="films" aria-hidden="true">
            <span class="letter">F</span>
            <span class="letter">I</span>
            <span class="letter">L</span>
            <span class="letter">M</span>
            <span class="letter">S</span>
        </div>
    </h1>

    <footer>
        <span>© 2026 Isochrone Films LLC. All rights reserved.</span>
        <span>
            <a href="/privacy">Privacy Policy</a>
            &nbsp;·&nbsp;
            <a href="/terms">Terms of Use</a>
        </span>
    </footer>

    <script>
        document.fonts.ready.then(() => {
            document.getElementById('wordmark').classList.add('ready');
        });
    </script>

</body>
</html>
