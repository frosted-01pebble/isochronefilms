<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isochrone Films</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Raleway:wght@200&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0c;
            color: #e5e0d8;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('map-bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.55;
            z-index: 0;
        }

        .wordmark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 90vw;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            z-index: 1;
        }

        .wordmark.ready {
            opacity: 1;
        }

        .title-row {
            display: flex;
            align-items: baseline;
        }

        .letter {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 9vw, 9.5rem);
            color: #e5e0d8;
            display: inline-block;
            line-height: 0.95;
        }

        .films-row .letter {
            font-size: clamp(1rem, 2.6vw, 2.8rem);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #e5e0d8;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.8;
            z-index: 1;
        }

        footer a {
            color: #e5e0d8;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }


        .rings {
            position: absolute;
            top: 50%;
            left: 50%;
            pointer-events: none;
            overflow: visible;
        }

        .ring {
            position: absolute;
            width: 82vw;
            height: 22vw;
            border-width: 2px;
            border-style: solid;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.25);
            opacity: 0;
            filter: blur(0.8px);
        }

        .wordmark:hover .ring {
            animation: iso-expand 3.15s ease-out infinite;
        }

        /* Isochrone heat-map colors: red → orange → yellow → green → teal → blue → purple */
        .wordmark:hover .ring:nth-child(1) {
            border-color: rgba(220, 30, 0, 0.95);
            box-shadow: 0 0 10px rgba(220, 30, 0, 0.5), 0 0 22px rgba(220, 30, 0, 0.25);
            animation-delay: 0s;
        }
        .wordmark:hover .ring:nth-child(2) {
            border-color: rgba(255, 120, 0, 0.9);
            box-shadow: 0 0 10px rgba(255, 120, 0, 0.5), 0 0 22px rgba(255, 120, 0, 0.25);
            animation-delay: 0.45s;
        }
        .wordmark:hover .ring:nth-child(3) {
            border-color: rgba(255, 220, 0, 0.85);
            box-shadow: 0 0 10px rgba(255, 220, 0, 0.5), 0 0 22px rgba(255, 220, 0, 0.25);
            animation-delay: 0.9s;
        }
        .wordmark:hover .ring:nth-child(4) {
            border-color: rgba(80, 210, 60, 0.8);
            box-shadow: 0 0 10px rgba(80, 210, 60, 0.5), 0 0 22px rgba(80, 210, 60, 0.25);
            animation-delay: 1.35s;
        }
        .wordmark:hover .ring:nth-child(5) {
            border-color: rgba(0, 200, 200, 0.75);
            box-shadow: 0 0 10px rgba(0, 200, 200, 0.5), 0 0 22px rgba(0, 200, 200, 0.25);
            animation-delay: 1.8s;
        }
        .wordmark:hover .ring:nth-child(6) {
            border-color: rgba(0, 80, 240, 0.7);
            box-shadow: 0 0 10px rgba(0, 80, 240, 0.5), 0 0 22px rgba(0, 80, 240, 0.25);
            animation-delay: 2.25s;
        }
        .wordmark:hover .ring:nth-child(7) {
            border-color: rgba(140, 0, 240, 0.65);
            box-shadow: 0 0 10px rgba(140, 0, 240, 0.5), 0 0 22px rgba(140, 0, 240, 0.25);
            animation-delay: 2.7s;
        }

        @keyframes iso-expand {
            0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 1; }
            15%  { opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(2.8);  opacity: 0; }
        }

        .top-nav {
            position: fixed;
            top: 1.4rem;
            right: 1.8rem;
            display: flex;
            gap: 2rem;
            z-index: 2;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.4vw, 1.05rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-nav a {
            color: #e5e0d8;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .top-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            footer {
                font-size: 0.42rem;
                letter-spacing: 0.08em;
                padding: 0.8rem 1rem;
                gap: 0.3rem;
            }

            .top-nav {
                top: 1rem;
                right: 1rem;
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

    <div class="wordmark" id="wordmark">
        <div class="rings" aria-hidden="true">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>
        <div class="title-row" id="isochrone">
            <span class="letter">I</span>
            <span class="letter">S</span>
            <span class="letter">O</span>
            <span class="letter">C</span>
            <span class="letter">H</span>
            <span class="letter">R</span>
            <span class="letter">O</span>
            <span class="letter">N</span>
            <span class="letter">E</span>
        </div>
        <div class="title-row films-row" id="films">
            <span class="letter">F</span>
            <span class="letter">I</span>
            <span class="letter">L</span>
            <span class="letter">M</span>
            <span class="letter">S</span>
        </div>
    </div>

    <footer>
        <span>© 2026 Isochrone Films LLC. All rights reserved.</span>
        <span>
            <a href="/privacy">Privacy Policy</a>
            &nbsp;·&nbsp;
            <a href="/terms">Terms of Use</a>
            &nbsp;·&nbsp;
            Isochrone Films LLC does not accept unsolicited submissions. Any unsolicited materials received are not reviewed and confer no obligations.
        </span>
    </footer>

    <script>
        document.fonts.ready.then(() => {
            document.getElementById('wordmark').classList.add('ready');
        });
    </script>

</body>
</html>
