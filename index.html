<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isochrone Films</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Raleway:wght@200&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0c;
            color: #e5e0d8;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('antique%20map.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.55;
            z-index: 0;
        }

        .wordmark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 90vw;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            z-index: 1;
        }

        .wordmark.ready {
            opacity: 1;
        }

        .title-row {
            display: flex;
            align-items: baseline;
        }

        .letter {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 9vw, 9.5rem);
            color: #e5e0d8;
            display: inline-block;
            line-height: 0.95;
        }

        .films-row .letter {
            font-size: clamp(1rem, 2.6vw, 2.8rem);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #3a3a38;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.8;
            z-index: 1;
        }

        footer a {
            color: #3a3a38;
            text-decoration: none;
        }

        footer a:hover {
            color: #666;
        }


        @media (max-width: 600px) {
            footer {
                font-size: 0.42rem;
                letter-spacing: 0.08em;
                padding: 0.8rem 1rem;
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="wordmark" id="wordmark">
        <div class="title-row" id="isochrone">
            <span class="letter">I</span>
            <span class="letter">S</span>
            <span class="letter">O</span>
            <span class="letter">C</span>
            <span class="letter">H</span>
            <span class="letter">R</span>
            <span class="letter">O</span>
            <span class="letter">N</span>
            <span class="letter">E</span>
        </div>
        <div class="title-row films-row" id="films">
            <span class="letter">F</span>
            <span class="letter">I</span>
            <span class="letter">L</span>
            <span class="letter">M</span>
            <span class="letter">S</span>
        </div>
    </div>

    <footer>
        <span>© 2026 Isochrone Films LLC. All rights reserved.</span>
        <span>
            <a href="/privacy">Privacy Policy</a>
            &nbsp;·&nbsp;
            <a href="/terms">Terms of Use</a>
            &nbsp;·&nbsp;
            Isochrone Films LLC does not accept unsolicited submissions. Any unsolicited materials received are not reviewed and confer no obligations.
        </span>
    </footer>

    <script>
        document.fonts.ready.then(() => {
            document.getElementById('wordmark').classList.add('ready');
        });
    </script>

</body>
</html>
