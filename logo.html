<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Isochrone Films — Logo Export</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }
        canvas { display: block; max-width: 80vw; max-height: 80vh; }
        button {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 0.6rem 2rem;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: sans-serif;
            transition: border-color 0.2s, color 0.2s;
        }
        button:hover { border-color: #e5e0d8; color: #e5e0d8; }
    </style>
</head>
<body>

    <canvas id="logo" width="1000" height="1000"></canvas>
    <button id="download">Download JPG</button>

    <script>
        const canvas = document.getElementById('logo');
        const ctx    = canvas.getContext('2d');
        const W = 1000, H = 1000;

        // --- Shape definition ---
        const CX  = 500;
        const TOP = 148, BOT = 852;
        const BW  = 140;   // half bar width  → bar = 280px
        const SW  = 44;    // half stem width → stem = 88px
        const BH  = 72;    // bar height

        // 12 vertices of the I, clockwise from top-left
        const iVerts = [
            [CX - BW, TOP],
            [CX + BW, TOP],
            [CX + BW, TOP + BH],
            [CX + SW, TOP + BH],
            [CX + SW, BOT - BH],
            [CX + BW, BOT - BH],
            [CX + BW, BOT],
            [CX - BW, BOT],
            [CX - BW, BOT - BH],
            [CX - SW, BOT - BH],
            [CX - SW, TOP + BH],
            [CX - BW, TOP + BH],
        ];

        // --- Helpers ---
        function rand(r) { return (Math.random() - 0.5) * 2 * r; }

        // Build a jagged version of the shape once, reuse for fill + clip
        function buildJaggedPath(verts, edgeJitter, stepSize) {
            const pts = [];
            const n   = verts.length;
            for (let i = 0; i < n; i++) {
                const [x1, y1] = verts[i];
                const [x2, y2] = verts[(i + 1) % n];
                const dist  = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.max(Math.ceil(dist / stepSize), 3);
                for (let s = 0; s < steps; s++) {
                    const t  = s / steps;
                    const jx = rand(edgeJitter) * (0.5 + Math.random() * 0.5);
                    const jy = rand(edgeJitter) * (0.5 + Math.random() * 0.5);
                    pts.push([x1 + (x2 - x1) * t + jx, y1 + (y2 - y1) * t + jy]);
                }
            }
            return pts;
        }

        function tracePath(ctx, pts) {
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath();
        }

        // --- Draw ---
        ctx.fillStyle = '#0d0d0c';
        ctx.fillRect(0, 0, W, H);

        // Very slight tilt — handmade feel
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-0.012);
        ctx.translate(-W / 2, -H / 2);

        // Build the jagged path once
        const jagPts = buildJaggedPath(iVerts, 4.5, 14);

        // Shadow pass
        ctx.shadowColor   = 'rgba(0,0,0,0.55)';
        ctx.shadowBlur    = 28;
        ctx.shadowOffsetX = 7;
        ctx.shadowOffsetY = 14;
        tracePath(ctx, jagPts);
        ctx.fillStyle = '#e9e3d5';
        ctx.fill();

        // Reset shadow, clip to shape for texture
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur  = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        ctx.save();
        tracePath(ctx, jagPts);
        ctx.clip();

        // Paper grain
        const imgData = ctx.getImageData(0, 0, W, H);
        const data    = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const noise = (Math.random() - 0.5) * 18;
            data[i]     = Math.min(255, Math.max(0, data[i]     + noise));
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
        }
        ctx.putImageData(imgData, 0, 0);

        // Subtle fibrous lines
        ctx.strokeStyle = 'rgba(120,100,70,0.06)';
        ctx.lineWidth   = 0.8;
        for (let i = 0; i < 60; i++) {
            const y = Math.random() * H;
            ctx.beginPath();
            ctx.moveTo(0, y + rand(4));
            ctx.lineTo(W, y + rand(4));
            ctx.stroke();
        }

        // Cut-edge highlight: thin bright line along perimeter
        tracePath(ctx, jagPts);
        ctx.strokeStyle = 'rgba(255,248,235,0.35)';
        ctx.lineWidth   = 1.2;
        ctx.stroke();

        ctx.restore(); // release clip
        ctx.restore(); // release rotation

        // --- Download ---
        document.getElementById('download').addEventListener('click', () => {
            // Composite on white for JPG
            const out = document.createElement('canvas');
            out.width  = W;
            out.height = H;
            const oc   = out.getContext('2d');
            oc.fillStyle = '#0d0d0c';
            oc.fillRect(0, 0, W, H);
            oc.drawImage(canvas, 0, 0);
            const link = document.createElement('a');
            link.download = 'isochrone-films-I.jpg';
            link.href     = out.toDataURL('image/jpeg', 0.97);
            link.click();
        });
    </script>

</body>
</html>
