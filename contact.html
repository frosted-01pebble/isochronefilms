<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Isochrone Films</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Raleway:wght@200;300;400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .top-nav {
            position: fixed;
            top: 1.4rem;
            right: 1.8rem;
            display: flex;
            gap: 2rem;
            z-index: 2;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.4vw, 1.05rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .top-nav a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            .top-nav { top: 1rem; right: 1rem; gap: 1.2rem; }
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header, main, footer { position: relative; }

        header {
            padding: 2rem 0 2rem;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 1.5rem;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
            width: 100%;
        }

        .field {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            padding: 0.4rem 0;
            outline: none;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
            border-radius: 0;
        }

        input:focus, textarea:focus {
            border-bottom-color: #ffffff;
        }

        textarea {
            resize: none;
            height: 7rem;
            line-height: 1.6;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .submit-row {
            margin-top: 2.5rem;
        }

        .submit-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        button[type="submit"] {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 0.7rem 2.2rem;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        button[type="submit"]:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        button[type="submit"]:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .form-status {
            margin-top: 1.5rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            min-height: 1.2em;
        }

        .form-status.success { color: #a0d8a0; }
        .form-status.error   { color: #e88; }

        .contact-alt {
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        .contact-alt a {
            color: #ffffff;
            text-decoration: none;
            transition: text-shadow 0.2s ease;
        }

        .contact-alt a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        footer {
            margin-top: auto;
            padding: 1rem 1.5rem;
            text-align: center;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-transform: uppercase;
            background: #000000;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            transition: text-shadow 0.2s ease;
        }

        footer a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/about">About</a>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
    </nav>

    <header>
        <h1>Contact</h1>
    </header>

    <main>
        <form id="contact-form">
            <!-- Web3Forms access key — maps to recipient email server-side -->
            <input type="hidden" name="access_key" value="e0ed485b-13ad-49bf-af0c-c5e581f3d641">
<input type="checkbox" name="botcheck" style="display:none">

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your name">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="field">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required placeholder="Subject">
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Your message"></textarea>
            </div>

            <div class="submit-row">
                <div class="submit-actions">
                    <button type="submit">Send</button>
                    <span class="contact-alt">or email <a href="mailto:hello@isochronefilms.com">hello@isochronefilms.com</a></span>
                </div>
                <p class="form-status" id="form-status"></p>
            </div>
        </form>
    </main>

    <footer>
        <span>© 2026 Isochrone Films LLC. All rights reserved. &nbsp;·&nbsp; <a href="/privacy">Privacy Policy</a> &nbsp;·&nbsp; <a href="/terms">Terms of Use</a></span>
    </footer>

    <script>
        const form = document.getElementById('contact-form');
        const status = document.getElementById('form-status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            status.textContent = '';
            status.className = 'form-status';

            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    status.textContent = 'Message sent.';
                    status.className = 'form-status success';
                    form.reset();
                } else {
                    throw new Error(data.message || 'Submission failed');
                }
            } catch (err) {
                status.textContent = 'Something went wrong — please try again.';
                status.className = 'form-status error';
            } finally {
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
