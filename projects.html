<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Isochrone Films</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Raleway:wght@200;300;400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .top-nav {
            position: fixed;
            top: 1.4rem;
            right: 1.8rem;
            display: flex;
            gap: 2rem;
            z-index: 2;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.4vw, 1.05rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .top-nav a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            .top-nav { top: 1rem; right: 1rem; gap: 1.2rem; }
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            line-height: 1.8;
            min-height: 100vh;
        }

        header, main, footer { position: relative; }

        header {
            padding: 2rem 0 2rem;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 1.5rem;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem 2rem 8rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 340px));
            justify-content: start;
            gap: 2.5rem;
        }

        .project-card {
            display: block;
            background: #050505;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.9rem;
            text-decoration: none;
            color: #fff;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .project-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .project-card .thumb {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
        }

        .project-card .thumb.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            background: #6b6b6b;
        }

        .thumb.placeholder svg {
            width: 38%;
            height: auto;
        }

        .project-card .card-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.1rem;
            padding-top: 1.1rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.35);
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .project-card .card-type {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.55);
            flex: 0 0 auto;
        }

        .project-card .card-title {
            font-size: 0.85rem;
            text-align: center;
            flex: 1 1 auto;
        }

        .project-card .card-year {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.55);
            flex: 0 0 auto;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            text-align: center;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-transform: uppercase;
            background: #000000;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            transition: text-shadow 0.2s ease;
        }

        footer a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="/about">About</a>
        <a href="/">Home</a>
        <a href="/contact">Contact</a>
    </nav>

    <header>
        <h1>Projects</h1>
    </header>

    <main>
        <div class="projects-grid">
            <a class="project-card" href="/the-end-is-at-hand">
                <img class="thumb" src="/assets/teiah/still-A.jpg" alt="Still from The End Is At Hand">
                <div class="card-meta">
                    <span class="card-type">Short Film</span>
                    <span class="card-title">The End Is At Hand</span>
                    <span class="card-year">2025</span>
                </div>
            </a>

            <div class="project-card">
                <div class="thumb placeholder">
                    <svg viewBox="0 0 100 60" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 30 C25 6 75 6 95 30 C75 54 25 54 5 30 Z"></path>
                        <circle cx="50" cy="30" r="10" fill="#ffffff" stroke="none"></circle>
                    </svg>
                </div>
                <div class="card-meta">
                    <span class="card-type">Feature</span>
                    <span class="card-title">The End Is At Hand</span>
                    <span class="card-year">Coming Soon</span>
                </div>
            </div>

            <div class="project-card">
                <div class="thumb placeholder">
                    <svg viewBox="0 0 100 60" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 50 L18 10 L32 10 L32 18 L46 18 C58 18 68 24 76 32 L88 35 C94 37 95 43 90 47 L90 49 C90 50 88 50 85 50 Z"></path>
                        <line x1="18" y1="16" x2="32" y2="20" stroke-width="2.5"></line>
                        <line x1="18" y1="24" x2="32" y2="28" stroke-width="2.5"></line>
                        <line x1="18" y1="32" x2="26" y2="34" stroke-width="2.5"></line>
                    </svg>
                </div>
                <div class="card-meta">
                    <span class="card-type">Feature</span>
                    <span class="card-title">Plausible Deniability</span>
                    <span class="card-year">Coming Soon</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <span>© 2026 Isochrone Films LLC. All rights reserved. &nbsp;·&nbsp; <a href="/privacy">Privacy Policy</a> &nbsp;·&nbsp; <a href="/terms">Terms of Use</a></span>
    </footer>

</body>
</html>
