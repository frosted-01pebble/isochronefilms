<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Isochrone Films">
  <title>Isochrone Films</title>
  <!--
    The "I" is drawn as geometry rather than <text> so it renders identically
    everywhere: an SVG favicon cannot rely on a webfont, and font-family would
    fall back to whatever sans the viewer happens to have.

    Proportions are taken from Neue Haas Grotesk Display Bold, whose cap I is a
    plain stem with no serifs or flare. Measured off the live face: cap height
    0.715em, stem/cap 0.2476. Cap here is 24 of 32 (75%), so the stem is
    24 x 0.2476 = 5.942, centred at x = (32 - 5.942) / 2.

    The cap height is chosen so the stem lands on the pixel grid at the sizes
    browsers actually rasterise: 5.942 -> ~6px at 32, ~3px at 16, both within
    0.06px of whole. A 62.5% cap looks better on paper but puts the stem at
    2.476px at 16, straddling two pixels and rendering as a grey smear.

    Note the ratio is specific to this family — Helvetica's cap I is 0.2076,
    around 19% narrower, and reads as a different mark at small sizes.
  -->
  <rect width="32" height="32" fill="#000"/>
  <rect x="13.029" y="4" width="5.942" height="24" fill="#fff"/>
</svg>
