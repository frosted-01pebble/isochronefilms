    <!-- door panel, swung open in perspective -->
    <path d="M 127,30 L 230,50 L 230,150 L 127,168 Z" fill="#ffffff"></path>

    <!-- doorknob -->
    <circle cx="155" cy="102" r="6" fill="#6b6b6b"></circle>
</svg>
