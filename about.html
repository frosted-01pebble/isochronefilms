    <style>
        .top-nav {
            position: fixed;
            top: 1.4rem;
            right: 1.8rem;
            display: flex;
            gap: 2rem;
            z-index: 2;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.4vw, 1.05rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .top-nav a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 600px) {
            .top-nav { top: 1rem; right: 1rem; gap: 1.2rem; }
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header, main, footer { position: relative; }

        header {
            padding: 2rem 0 2rem;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 1.5rem;
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
            width: 100%;
        }

        footer {
            margin-top: auto;
            padding: 1rem 1.5rem;
            text-align: center;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            color: #fff;
            text-transform: uppercase;
            background: #000000;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        footer a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
        }
